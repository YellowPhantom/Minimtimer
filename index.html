<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Timer</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="controls" class="visible">
        <div class="menu">
            <input type="number" id="time-input" value="15" min="1" placeholder="Seconds">
            <button id="start-btn">Start Timer</button>
        </div>
        <p class="hint">Tap anywhere to cancel</p>
    </div>

    <canvas id="canvas"></canvas>

    <script src="./script.js"></script>
</body>
</html>
